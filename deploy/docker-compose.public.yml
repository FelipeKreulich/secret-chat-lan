# Public hub deployment: Caddy terminates TLS with an automatic Let's Encrypt
# certificate, proxies WebSocket traffic to the CipherMesh relay and serves the
# landing page to everything else — one domain, one certificate.
#
#   1. Point an A/AAAA record at this host (e.g. hub.example.com)
#   2. export CIPHERMESH_DOMAIN=hub.example.com CIPHERMESH_EMAIL=you@example.com
#   3. docker compose -f deploy/docker-compose.public.yml up -d
#
# Clients then connect to `hub.example.com:443`. Because the certificate chains
# to a real CA, the client verifies it strictly — no trust-on-first-use window
# (see src/client/Connection.js).
#
# The relay itself stays zero-knowledge either way: it only ever forwards
# ciphertext. TLS protects metadata in transit, not message contents.

services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ciphermesh-relay
    restart: unless-stopped
    environment:
      - PORT=3600
      - LOG_LEVEL=info
      # TLS is terminated by Caddy; the relay speaks plain ws:// on the
      # internal network only (never published to the host).
      - TLS=false
      # Caddy is the only thing talking to the relay, so the real client
      # address arrives in X-Forwarded-For. Without this the per-IP cap and
      # the banlist would apply to Caddy itself and protect nobody.
      - TRUST_PROXY=true
      # Public-internet ceilings (the defaults are tuned for a LAN).
      - MAX_CONNECTIONS_PER_IP=${MAX_CONNECTIONS_PER_IP:-5}
      - MAX_CONNECTIONS_TOTAL=${MAX_CONNECTIONS_TOTAL:-300}
      - MAX_ROOMS_PER_SESSION=${MAX_ROOMS_PER_SESSION:-5}
      - MAX_ROOMS_TOTAL=${MAX_ROOMS_TOTAL:-200}
      # Optional operator levers — see deploy/README.md
      - MOTD=${MOTD:-}
      - BANNED_IPS=${BANNED_IPS:-}
      # Publishes how busy the hub is, as a bucket, on its own listener. Only
      # the site container reads it — the port below is exposed to the Docker
      # network and never published to the host.
      - PRESENCE_PORT=${PRESENCE_PORT:-3601}
    expose:
      - '3600'
      - '3601'
    networks: [ciphermesh]

  # The landing page, served from the same domain as the relay. Caddy sends
  # WebSocket upgrades to the relay and everything else here, so a browser gets
  # the site and the client still connects to the bare domain.
  #
  # Built and published from the cipher-mesh-frontend repository on every merge
  # into its master branch.
  site:
    image: ghcr.io/felipekreulich/cipher-mesh-frontend:latest
    container_name: ciphermesh-site
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SITE_URL=https://${CIPHERMESH_DOMAIN}
      # Read server-side only, over the internal network. The browser never
      # talks to the relay's presence listener.
      - PRESENCE_URL=http://relay:${PRESENCE_PORT:-3601}/presence
    expose:
      - '3000'
    networks: [ciphermesh]

  caddy:
    image: caddy:2-alpine
    container_name: ciphermesh-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CIPHERMESH_DOMAIN=${CIPHERMESH_DOMAIN:?set CIPHERMESH_DOMAIN}
      - CIPHERMESH_EMAIL=${CIPHERMESH_EMAIL:?set CIPHERMESH_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — persist or you will hit LE rate limits
      - caddy_config:/config
    depends_on: [relay, site]
    networks: [ciphermesh]

networks:
  ciphermesh:

volumes:
  caddy_data:
  caddy_config:
