version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Dependabot defaults to the default branch. Here master is only ever
    # reached through dev, so a PR straight into master leaves dev behind and
    # the next release PR carries someone else's commits.
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(actions)'
