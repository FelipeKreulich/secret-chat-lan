name: Binarios do relay

# Standalone relay binaries (no Node required on the target machine).
# Client stays on npm: its TUI depends on blessed, which resolves widgets
# through dynamic requires that no bundler can follow (see issue #328).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the binaries to the GitHub Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # sodium-native ships prebuilt addons; npm ci fetches the right one for
      # this runner, and bun embeds it into the binary.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar binario
        run: bun build --compile bin/server-binary.js --outfile ciphermesh-server-${{ matrix.label }}

      - name: Verificar que o binario sobe
        shell: bash
        run: |
          TLS=false PORT=3999 ./ciphermesh-server-${{ matrix.label }} > out.log 2>&1 &
          PID=$!
          sleep 8
          cat out.log
          grep -q "Server started" out.log
          kill $PID

      - uses: actions/upload-artifact@v4
        with:
          name: ciphermesh-server-${{ matrix.label }}
          path: ciphermesh-server-${{ matrix.label }}

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ciphermesh-server-${{ matrix.label }}
