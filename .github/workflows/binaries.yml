name: Binarios

# Standalone binaries, no Node required on the target machine.
#
# Two per platform:
#   ciphermesh-<platform>         everything — client, relay and P2P
#   ciphermesh-server-<platform>  relay only, for self-hosters who want nothing else
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the binaries to the GitHub Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            prebuild: darwin-arm64
          # Intel macOS is cross-compiled from the arm64 runner: the hosted
          # macos-13 runners are being retired and jobs sat queued for hours.
          - os: macos-latest
            label: macos-x64
            target: bun-darwin-x64
            prebuild: darwin-x64
          - os: ubuntu-latest
            label: linux-x64
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            prebuild: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # blessed loads its widgets through a computed require, which no bundler
      # can follow. Rewrites that one loop into static requires.
      - name: Tornar o blessed empacotavel
        run: node scripts/patch-blessed.mjs

      # sodium-native resolves its prebuilt addon at runtime, so bun leaves an
      # absolute path back to this checkout instead of embedding it. Pinning it
      # to the TARGET's prebuild — not the host's — is what makes the binary
      # work anywhere else.
      - name: Embutir o addon do sodium-native
        run: node scripts/patch-sodium.mjs ${{ matrix.prebuild }}

      - name: Compilar binario completo
        env:
          TARGET_FLAG: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # pty.js and term.js are optional native deps of blessed's Terminal
          # widget, which the client never instantiates, and both requires are
          # lazy — leaving them external costs nothing.
          bun build --compile $TARGET_FLAG \
            --external pty.js --external term.js \
            --define "process.env.CIPHERMESH_VERSION=\"$VERSION\"" \
            bin/cli-binary.js --outfile ciphermesh-${{ matrix.label }}

      - name: Compilar binario so do relay
        env:
          TARGET_FLAG: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
        run: bun build --compile $TARGET_FLAG bin/server-binary.js --outfile ciphermesh-server-${{ matrix.label }}

      # THE point of this step is the `mv`. Running a binary next to the tree
      # that built it proves nothing: sodium-native's un-embedded addon resolved
      # through node_modules, so every check passed while every download was
      # broken (#427). Hiding the tree is what makes the rest honest.
      - name: Esconder a arvore de build
        run: mv node_modules ../node_modules_hidden

      - name: Verificar que o relay sobe sem a arvore
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          TLS=false PORT=3999 ./ciphermesh-server-${{ matrix.label }} > out.log 2>&1 &
          PID=$!
          sleep 10
          cat out.log
          kill $PID 2>/dev/null || true
          if grep -qi "Cannot find addon\|Cannot find module" out.log; then
            echo "O binario depende de ficheiros que nao carrega consigo" >&2
            exit 1
          fi
          grep -q "Server started" out.log

      - name: Verificar que o cliente sobe sem a arvore
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          ./ciphermesh-${{ matrix.label }} --version
          ./ciphermesh-${{ matrix.label }} --no-onboard < /dev/null > client.log 2>&1 &
          PID=$!
          sleep 10
          cat client.log
          kill $PID 2>/dev/null || true
          if grep -qi "Cannot find addon\|Cannot find module" client.log; then
            echo "O binario do cliente depende de ficheiros que nao carrega consigo" >&2
            exit 1
          fi
          grep -q "CipherMesh\|End-to-End" client.log

      - name: Verificar o relay do binario completo sem a arvore
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          TLS=false PORT=3998 ./ciphermesh-${{ matrix.label }} server > combined.log 2>&1 &
          PID=$!
          sleep 10
          cat combined.log
          kill $PID 2>/dev/null || true
          grep -q "Server started" combined.log

      # The cross-compiled binary cannot run natively here. Rosetta usually can,
      # and "it claims to be x86_64" is exactly the check that let a broken
      # binary ship — so run it for real, and fall back to the architecture
      # assertion only when Rosetta is genuinely absent.
      - name: Verificar o binario cross-compilado sem a arvore
        if: ${{ matrix.target }}
        shell: bash
        run: |
          file ./ciphermesh-${{ matrix.label }} ./ciphermesh-server-${{ matrix.label }}
          file ./ciphermesh-${{ matrix.label }} | grep -q "x86_64"
          file ./ciphermesh-server-${{ matrix.label }} | grep -q "x86_64"

          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta indisponivel neste runner; ficou so a verificacao de arquitetura"
            exit 0
          fi

          arch -x86_64 ./ciphermesh-${{ matrix.label }} --version
          TLS=false PORT=3997 arch -x86_64 ./ciphermesh-${{ matrix.label }} server > cross.log 2>&1 &
          PID=$!
          sleep 10
          cat cross.log
          kill $PID 2>/dev/null || true
          if grep -qi "Cannot find addon\|Cannot find module" cross.log; then
            echo "O binario cross-compilado depende de ficheiros que nao carrega consigo" >&2
            exit 1
          fi
          grep -q "Server started" cross.log

      - name: Repor a arvore de build
        if: always()
        run: mv ../node_modules_hidden node_modules

      - uses: actions/upload-artifact@v7
        with:
          name: ciphermesh-${{ matrix.label }}
          path: |
            ciphermesh-${{ matrix.label }}
            ciphermesh-server-${{ matrix.label }}

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ciphermesh-${{ matrix.label }}
            ciphermesh-server-${{ matrix.label }}
