name: Binarios do relay

# Standalone relay binaries (no Node required on the target machine).
# Client stays on npm: its TUI depends on blessed, which resolves widgets
# through dynamic requires that no bundler can follow (see issue #328).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the binaries to the GitHub Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          # Intel macOS is cross-compiled from the arm64 runner: the hosted
          # macos-13 runners are being retired and jobs sat queued for hours.
          # bun embeds the TARGET's prebuilt native addons, so the result is a
          # genuine x86_64 binary (verified locally: it starts and loads
          # sodium-native + ML-KEM under Rosetta).
          - os: macos-latest
            label: macos-x64
            target: bun-darwin-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # sodium-native ships prebuilt addons; npm ci fetches the right one for
      # this runner, and bun embeds it into the binary.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar binario
        env:
          TARGET_FLAG: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
        run: bun build --compile $TARGET_FLAG bin/server-binary.js --outfile ciphermesh-server-${{ matrix.label }}

      # Native builds are proven by actually running them. The cross-compiled
      # one cannot run on this runner, so assert its architecture instead —
      # a silently host-arch binary would be worse than no binary.
      - name: Verificar que o binario sobe
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          TLS=false PORT=3999 ./ciphermesh-server-${{ matrix.label }} > out.log 2>&1 &
          PID=$!
          sleep 8
          cat out.log
          grep -q "Server started" out.log
          kill $PID

      - name: Verificar arquitetura do binario cross-compilado
        if: ${{ matrix.target }}
        shell: bash
        run: |
          file ./ciphermesh-server-${{ matrix.label }}
          file ./ciphermesh-server-${{ matrix.label }} | grep -q "x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: ciphermesh-server-${{ matrix.label }}
          path: ciphermesh-server-${{ matrix.label }}

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ciphermesh-server-${{ matrix.label }}
