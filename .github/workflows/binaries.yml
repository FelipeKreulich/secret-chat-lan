name: Binarios

# Standalone binaries, no Node required on the target machine.
#
# Two per platform:
#   ciphermesh-<platform>         everything — client, relay and P2P
#   ciphermesh-server-<platform>  relay only, for self-hosters who want nothing else
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the binaries to the GitHub Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          # Intel macOS is cross-compiled from the arm64 runner: the hosted
          # macos-13 runners are being retired and jobs sat queued for hours.
          # bun embeds the TARGET's prebuilt native addons, so the result is a
          # genuine x86_64 binary (verified locally: it starts and loads
          # sodium-native + ML-KEM under Rosetta).
          - os: macos-latest
            label: macos-x64
            target: bun-darwin-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # sodium-native ships prebuilt addons; npm ci fetches the right one for
      # this runner, and bun embeds it into the binary.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # blessed loads its widgets through a computed require, the one thing in
      # the tree no bundler can follow. This rewrites that single loop into
      # static requires so the client can be bundled at all — see the script for
      # why it is safe, and issue #328 for the history.
      - name: Tornar o blessed empacotavel
        run: node scripts/patch-blessed.mjs

      - name: Compilar binario completo
        env:
          TARGET_FLAG: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # pty.js and term.js are optional native deps of blessed's Terminal
          # widget, which the client never instantiates. Their requires are
          # lazy, so leaving them external costs nothing and avoids shipping a
          # native dependency nobody uses.
          bun build --compile $TARGET_FLAG \
            --external pty.js --external term.js \
            --define "process.env.CIPHERMESH_VERSION=\"$VERSION\"" \
            bin/cli-binary.js --outfile ciphermesh-${{ matrix.label }}

      - name: Compilar binario so do relay
        env:
          TARGET_FLAG: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
        run: bun build --compile $TARGET_FLAG bin/server-binary.js --outfile ciphermesh-server-${{ matrix.label }}

      # Native builds are proven by actually running them. The cross-compiled
      # one cannot run on this runner, so assert its architecture instead —
      # a silently host-arch binary would be worse than no binary.
      - name: Verificar que o relay sobe
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          TLS=false PORT=3999 ./ciphermesh-server-${{ matrix.label }} > out.log 2>&1 &
          PID=$!
          sleep 8
          cat out.log
          grep -q "Server started" out.log
          kill $PID

      # The client is what was blocked, so it gets checked the hardest: the
      # binary has to reach the TUI, not just start. A missing widget shows up
      # as "Cannot find module './widgets/...'" the moment blessed builds the
      # screen, which is exactly what this catches.
      - name: Verificar que o cliente sobe
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          ./ciphermesh-${{ matrix.label }} --version
          ./ciphermesh-${{ matrix.label }} --no-onboard < /dev/null > client.log 2>&1 &
          PID=$!
          sleep 8
          cat client.log
          kill $PID 2>/dev/null || true
          if grep -q "Cannot find module" client.log; then
            echo "O binario do cliente nao consegue carregar seus modulos" >&2
            exit 1
          fi
          grep -q "CipherMesh\|End-to-End" client.log

      - name: Verificar que o relay do binario completo responde
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          TLS=false PORT=3998 ./ciphermesh-${{ matrix.label }} server > combined.log 2>&1 &
          PID=$!
          sleep 8
          cat combined.log
          grep -q "Server started" combined.log
          kill $PID

      - name: Verificar arquitetura dos binarios cross-compilados
        if: ${{ matrix.target }}
        shell: bash
        run: |
          file ./ciphermesh-${{ matrix.label }} ./ciphermesh-server-${{ matrix.label }}
          file ./ciphermesh-${{ matrix.label }} | grep -q "x86_64"
          file ./ciphermesh-server-${{ matrix.label }} | grep -q "x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: ciphermesh-${{ matrix.label }}
          path: |
            ciphermesh-${{ matrix.label }}
            ciphermesh-server-${{ matrix.label }}

      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ciphermesh-${{ matrix.label }}
            ciphermesh-server-${{ matrix.label }}
