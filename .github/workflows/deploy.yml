name: Deploy do relay

# Atualiza o relay publico quando uma release e publicada.
#
# A chave usada aqui NAO da shell no servidor: no authorized_keys ela esta
# restrita a `command="/opt/ciphermesh/deploy.sh"` com forwarding e PTY
# desabilitados. Se o segredo vazar, o atacante consegue no maximo disparar um
# deploy do codigo que ja esta no master — nao ler arquivos, nao abrir sessao.
# Chamado pelo workflow de release depois que os testes passam e o npm publica.
#
# NAO usa `on: release`: o GitHub deliberadamente nao dispara workflows a partir
# de eventos criados pelo GITHUB_TOKEN (protecao contra recursao), e a release e
# criada justamente pelo bot. O gatilho parecia funcionar e silenciosamente
# nunca rodava.
on:
  workflow_call:
  workflow_dispatch: # permite redeploy manual pela aba Actions

concurrency:
  group: deploy-relay
  cancel-in-progress: false # nunca interromper um deploy pela metade

jobs:
  deploy:
    name: Atualizar o relay em producao
    runs-on: ubuntu-latest
    # Ambiente permite exigir aprovacao manual antes do deploy, se um dia
    # quiser (Settings > Environments > production > required reviewers).
    environment: production
    steps:
      - name: Preparar chave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fixar a chave do host: sem isso um MITM poderia se passar pelo
          # servidor e receber o comando de deploy.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Disparar deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # O comando remoto e ignorado: o authorized_keys forca o deploy.sh.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" true

      - name: Confirmar que o relay responde
        env:
          # Endereco publico do relay. Com dominio + Caddy o servico atende em
          # 443; sem dominio, direto na 3600. Configuravel para o health check
          # nao ficar preso a uma topologia.
          HEALTH_TARGET: ${{ vars.DEPLOY_HEALTH_TARGET || 'ciphermesh.de:443' }}
        run: |
          HOST="${HEALTH_TARGET%%:*}"
          PORT="${HEALTH_TARGET##*:}"
          for i in $(seq 1 15); do
            if timeout 5 bash -c "</dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Relay respondendo em $HOST:$PORT"
              exit 0
            fi
            sleep 4
          done
          echo "O relay nao respondeu em $HOST:$PORT apos o deploy" >&2
          exit 1

      - name: Confirmar que o certificado e valido
        env:
          HEALTH_TARGET: ${{ vars.DEPLOY_HEALTH_TARGET || 'ciphermesh.de:443' }}
        run: |
          HOST="${HEALTH_TARGET%%:*}"
          PORT="${HEALTH_TARGET##*:}"
          # Verificacao ESTRITA: e assim que o cliente conecta a um host que ja
          # apresentou certificado de CA. Se o certificado quebrar (renovacao
          # falha, dominio errado), o deploy precisa falhar aqui e nao no
          # primeiro usuario que tentar entrar.
          if echo | openssl s_client -connect "$HOST:$PORT" -servername "$HOST" \
               -verify_return_error -brief 2>&1 | grep -q "Verification: OK"; then
            echo "Certificado valido para $HOST"
          else
            echo "AVISO: certificado nao validou para $HOST (self-signed?)"
            # Nao falha o deploy: uma instalacao sem dominio usa self-signed
            # legitimamente. O passo acima ja garantiu que o servico responde.
          fi
